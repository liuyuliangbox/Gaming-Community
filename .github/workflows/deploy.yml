name: Build and Deploy Site

on:
  schedule:
    # Daily ~10:00 Asia/Shanghai (UTC 02:00)
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Sync forum + deploy Worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync forum + build
        env:
          FORUM_API_BASE: https://bbs.aridjaya.eu.org
        run: npm run build

      - name: Deploy Worker (Assets)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CF_API_TOKEN / CF_ACCOUNT_ID not set in this repo."
            echo "Daily/manual deploy: use CForum → Rebuild Official Site."
            exit 0
          fi
          npx wrangler deploy
